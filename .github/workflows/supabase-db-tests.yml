name: Supabase database security tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "assets/auth.js"
      - "assets/supabase-config.example.js"
      - "auth.html"
      - "scripts/auth-ui-smoke-check.mjs"
      - ".github/workflows/supabase-db-tests.yml"
  push:
    branches:
      - feature/phase-2-supabase-foundation
    paths:
      - "supabase/**"
      - "assets/auth.js"
      - "assets/supabase-config.example.js"
      - "auth.html"
      - "scripts/auth-ui-smoke-check.mjs"
      - ".github/workflows/supabase-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check authentication JavaScript syntax
        run: node --check assets/auth.js

      - name: Run authentication page smoke checks
        run: node scripts/auth-ui-smoke-check.mjs

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        id: supabase-start
        run: supabase start

      - name: Apply migrations to a clean database
        run: supabase db reset

      - name: Run database permission and RLS tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always() && steps.supabase-start.outcome == 'success'
        run: supabase stop --no-backup
