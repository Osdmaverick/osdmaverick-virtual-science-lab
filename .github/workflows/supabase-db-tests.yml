name: Supabase database security tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-db-tests.yml"
  push:
    branches:
      - feature/phase-2-supabase-foundation
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-db-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Apply migrations to a clean database
        run: supabase db reset

      - name: Run database permission and RLS tests
        run: supabase test db

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
